name: commitlint

# The enforcement layer. The local commit-msg hook is fast feedback, but
# `git commit --no-verify` skips it — this cannot be skipped once the check
# is marked required in branch protection.
#
# Reads the same .commitlintrc.yaml as the local hook, so the rules can never
# drift between your machine and CI.

on:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # needs every commit in the PR, not just the tip

      - uses: wagoid/commitlint-github-action@v6.2.1
        with:
          configFile: .commitlintrc.yaml
          # commitlint's defaultIgnores stays on, so "Merge ..." and
          # "Revert ..." commits generated by the GitHub UI do not fail here.
